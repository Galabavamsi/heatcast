<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img">
  <rect width="960" height="340" rx="16" fill="#0b0d10"/>
  <rect x="1" y="1" width="958" height="338" rx="15" fill="none" stroke="#2a313c"/>
  <text x="32" y="42" fill="#22d3ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3">WHAT EACH LAYER IS FOR</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="32" y="64" width="440" height="118" rx="12" fill="#161a20" stroke="#2a313c"/>
    <text x="52" y="92" fill="#f59e0b" font-size="15" font-weight="700">Heat tiles · FortyGuard TCM</text>
    <text x="52" y="116" fill="#e8edf4" font-size="13">~100 m 2 m air temperature at the scored hour.</text>
    <text x="52" y="136" fill="#94a3b8" font-size="13">Use: find the hottest block, not a sidewalk CFD model.</text>
    <rect x="488" y="64" width="440" height="118" rx="12" fill="#161a20" stroke="#2a313c"/>
    <text x="508" y="92" fill="#fb7185" font-size="15" font-weight="700">Exceedance · hours e threshold</text>
    <text x="508" y="116" fill="#e8edf4" font-size="13">How long the district sits at/above 35 °C (Houston).</text>
    <text x="508" y="136" fill="#94a3b8" font-size="13">Use: outdoor-work duration, not peak °C alone.</text>
    <rect x="32" y="198" width="290" height="118" rx="12" fill="#161a20" stroke="#2a313c"/>
    <text x="52" y="226" fill="#a78bfa" font-size="15" font-weight="700">SVI · CDC 2022</text>
    <text x="52" y="250" fill="#e8edf4" font-size="13">Who is more socially</text>
    <text x="52" y="270" fill="#e8edf4" font-size="13">vulnerable in the same box.</text>
    <text x="52" y="294" fill="#94a3b8" font-size="13">Use: prioritize equity, not just heat.</text>
    <rect x="334" y="198" width="290" height="118" rx="12" fill="#161a20" stroke="#2a313c"/>
    <text x="354" y="226" fill="#67e8f9" font-size="15" font-weight="700">Shade · OSM + sun</text>
    <text x="354" y="250" fill="#e8edf4" font-size="13">Building umbra at 15:00.</text>
    <text x="354" y="270" fill="#e8edf4" font-size="13">Houston July: short shadows.</text>
    <text x="354" y="294" fill="#94a3b8" font-size="13">Use: massing context, not FG shade.</text>
    <rect x="636" y="198" width="292" height="118" rx="12" fill="#161a20" stroke="#2a313c"/>
    <text x="656" y="226" fill="#22d3ee" font-size="15" font-weight="700">Cooling · OSM sites</text>
    <text x="656" y="250" fill="#e8edf4" font-size="13">Libraries, community centres.</text>
    <text x="656" y="270" fill="#e8edf4" font-size="13">Not an official registry.</text>
    <text x="656" y="294" fill="#94a3b8" font-size="13">Use: nearby indoor public space.</text>
  </g>
</svg>
